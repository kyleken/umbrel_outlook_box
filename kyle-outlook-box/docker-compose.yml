version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: kyle-outlook-box_windows_1
      APP_PORT: 8006

  windows:
    image: dockurr/windows:latest
    restart: on-failure
    stop_grace_period: 2m
    environment:
      VERSION: "win11x64-enterprise-ltsc"  # full (non-evaluation) LTSC 2024; "11l" is the expiring evaluation
      VERIFY: "Y"               # check the downloaded ISO against Microsoft's SHA-256
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
      USERNAME: "outlook"
      PASSWORD: ${APP_PASSWORD} # Shown on the app's page in umbrelOS
      COMMAND: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "New-Item -ItemType Directory -Force C:\OEM | Out-Null; Invoke-WebRequest -UseBasicParsing https://raw.githubusercontent.com/kyleken/umbrel_outlook_box/main/windows-setup/setup.ps1 -OutFile C:\OEM\setup.ps1; & C:\OEM\setup.ps1"'
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 3389:3389/tcp           # RDP for a better client than the web viewer
      - 3389:3389/udp
    volumes:
      - ${APP_DATA_DIR}/data/storage:/storage
