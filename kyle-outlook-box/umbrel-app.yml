manifestVersion: 1
id: kyle-outlook-box
name: Outlook Box
tagline: A minimal Windows 11 LTSC that runs the new Outlook, in your browser
icon: https://github.com/dockur/windows/raw/master/.github/logo.png
category: files
version: "1.2.0"
port: 18006
description: >-
  Runs Windows 11 Enterprise LTSC 2024 in a KVM-accelerated container using dockur/windows,
  and installs the new Outlook for Windows automatically on first boot.
  For browser access with clipboard and audio, use the MS Mail app instead.


  First start downloads Windows (~5 GB) and installs it unattended. This
  takes 15-30 minutes. Open the app to watch progress.


  The in-browser viewer is convenient but basic (no clipboard or audio). For
  daily use, connect with any RDP client to port 3389 on your Umbrel using the
  username and password shown on this page.


  Requires an x86 Umbrel with hardware virtualization (Intel VT-x / AMD-V)
  enabled. Uses about 4 GB RAM and up to 64 GB of disk.
developer: dockur
website: https://github.com/dockur/windows
submitter: kyle
submission: https://github.com/dockur/windows
repo: https://github.com/dockur/windows
support: https://github.com/dockur/windows/issues
gallery: []
releaseNotes: >-
  Uses the full Windows 11 Enterprise LTSC 2024 image instead of the
  evaluation (which expires and shuts down every hour). Activate with your own
  key in Windows. Only affects new installs: uninstall and reinstall the app.
dependencies: []
path: ""
defaultUsername: "outlook"
deterministicPassword: true
