manifestVersion: 1
id: kyle-ms-mail
name: MS Mail
tagline: The new Outlook for Windows, in your browser
icon: https://raw.githubusercontent.com/kyleken/umbrel_outlook_box/main/kyle-ms-mail/icon.svg
category: files
version: "1.2.0"
port: 18080
path: "/#/client/T3V0bG9vawBjAGRlZmF1bHQ="
description: >-
  An all-in-one mail box: a lean Windows 11 Enterprise LTSC virtual machine that installs the
  new Outlook for Windows automatically, plus Apache Guacamole so you can use
  it from any web browser, including over Tailscale.


  Opening the app connects straight to Outlook. Sign in to Guacamole with the
  username and password shown on this page (the same ones Windows uses).


  First start downloads and installs Windows unattended, which takes about
  20-40 minutes. Until it finishes, the Outlook connection will fail; that is
  normal. To watch progress, go to the Guacamole home page (Ctrl+Alt+Shift,
  then Home) and open "Windows console (install progress)".


  Requires an x86 Umbrel with hardware virtualization (Intel VT-x / AMD-V)
  enabled. Uses about 4.5 GB RAM and up to 64 GB of disk.


  Uses the full Windows 11 Enterprise LTSC 2024 image (not the evaluation,
  which expires and shuts down every hour). Activate it with your own LTSC
  key in Windows: Settings, then System, then Activation, then Change product
  key.
developer: Apache Guacamole and dockur
website: https://guacamole.apache.org
submitter: kyleken
submission: https://github.com/kyleken/umbrel_outlook_box
repo: https://github.com/kyleken/umbrel_outlook_box
support: https://github.com/kyleken/umbrel_outlook_box/issues
gallery: []
releaseNotes: >-
  "Outlook only" now launches the new Outlook through its app ID (packaged
  apps can't be started by exe path over RemoteApp). New installs also turn
  off automatic sign-in, which left a desktop session that blanked RemoteApp.
dependencies: []
defaultUsername: "outlook"
deterministicPassword: true
